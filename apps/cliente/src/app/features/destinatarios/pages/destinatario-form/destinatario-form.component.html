<div class="page-container">
  <app-page-header
    [title]="esEdicion() ? 'Editar destinatario' : 'Nuevo destinatario'"
    subtitle="Datos de quien recibe tus envíos"
  >
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      severity="secondary"
      [text]="true"
      [routerLink]="listaRoute"
    />
  </app-page-header>

  @if (loading()) {
    <app-loading-spinner message="Cargando destinatario..." />
  } @else if (error()) {
    <app-error-alert [message]="error()!" [retryable]="true" (retry)="cargar()" />
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="card destinatario-form">
      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="w-full" />
      }

      <app-destinatario-campos [form]="form" [tiposIdentificacion]="identificaciones()" />

      <div class="form-actions">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [text]="true"
          [routerLink]="listaRoute"
        />
        <p-button type="submit" label="Guardar" icon="pi pi-check" [loading]="guardando()" />
      </div>
    </form>
  }
</div>
