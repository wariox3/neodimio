<div class="shell-layout">
  <!-- Navbar -->
  <header class="shell-navbar">
    <div class="navbar-start">
      @if (hasSidebar()) {
        <button class="hamburger-btn" (click)="toggleDrawer()" aria-label="Abrir menú">
          <i class="pi pi-bars"></i>
        </button>
      }
      <a class="navbar-brand" [routerLink]="inicioRoute" aria-label="Ir al inicio">
        <img src="fondo_transparente.png" alt="Semantica Seguridad" class="navbar-logo-img" />
      </a>
    </div>

    <div class="navbar-end">
      <app-user-menu />
    </div>
  </header>

  <div class="shell-body">
    <!-- Sidebar desktop: cada área pinta sus propias opciones -->
    @if (hasSidebar()) {
      <aside class="shell-sidebar">
        <ng-container *ngTemplateOutlet="navTpl" />
      </aside>
    }

    <!-- Main content -->
    <main class="shell-content">
      <router-outlet />
    </main>
  </div>
</div>

<!-- Drawer móvil -->
<p-drawer
  [visible]="drawerVisible()"
  (visibleChange)="drawerVisible.set($event)"
  position="left"
  [header]="areaConfig().title ?? 'Menú'"
>
  <ng-container *ngTemplateOutlet="navTpl" />
</p-drawer>

<!-- Template compartido para la navegación -->
<ng-template #navTpl>
  @if (showBack()) {
    <a class="sidebar-back" [routerLink]="inicioRoute" (click)="drawerVisible.set(false)">
      <i class="pi pi-arrow-left" aria-hidden="true"></i>
      <span>Volver al inicio</span>
    </a>
  }

  @if (areaConfig().title) {
    <p class="sidebar-title">
      <i [class]="areaConfig().icon" aria-hidden="true"></i>
      {{ areaConfig().title }}
    </p>
  }

  <nav class="sidebar-nav">
    @for (item of navItems(); track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        (click)="drawerVisible.set(false)"
      >
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</ng-template>
